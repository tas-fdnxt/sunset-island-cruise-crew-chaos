<!DOCTYPE html>
<html lang="en">

<style>
  :root { --ink:#2A1B3D; --cream:#FFF3E2; --coral:#FF6E6C; --peach:#FFB067;
    --yellow:#FFD447; --green:#3FA96B; --dusk:#5C3A6E; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  canvas#world { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; }
  canvas#gl { position:fixed; inset:0; width:100vw; height:100dvh; display:none; touch-action:none; z-index:4; }
  body.walking canvas#gl { display:block; }
  body.walking canvas#world, body.walking #bottombar, body.walking #next, body.walking #quest, body.walking #dial, body.walking #mini, body.walking #keeper, body.walking #btn-book, body.walking #btn-story, body.walking #drawer { display:none !important; }
  #walkui { display:none; }
  body.walking #walkui { display:block; }
  body.walking #topbar, body.walking #lineage { z-index:6; }
  #stick { position:fixed; left:22px; bottom:calc(env(safe-area-inset-bottom,0px) + 26px); width:118px; height:118px; border-radius:50%; background:rgba(42,27,61,0.28); border:3px solid rgba(255,243,226,0.7); z-index:6; pointer-events:none; }
  #knob { position:absolute; left:34px; top:34px; width:44px; height:44px; border-radius:50%; background:var(--cream); border:3px solid var(--ink); box-sizing:border-box; }
  #w-jump, #w-exit { position:fixed; right:18px; z-index:7; height:66px; border-radius:18px; border:3px solid var(--ink); background:var(--yellow); color:var(--ink); font:900 13px/1.05 system-ui; box-shadow:0 4px 0 var(--ink); padding:0 14px; }
  #w-jump { bottom:calc(env(safe-area-inset-bottom,0px) + 26px); width:96px; height:96px; border-radius:50%; font-size:15px; }
  #w-exit { bottom:calc(env(safe-area-inset-bottom,0px) + 136px); background:var(--coral); color:var(--cream); }
  #w-hint { position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 92px); z-index:7; background:rgba(42,27,61,0.75); color:var(--cream); font:800 12px system-ui; padding:8px 14px; border-radius:14px; opacity:0; transition:opacity .4s; pointer-events:none; }
  #w-hint.on { opacity:1; }
  #topbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:center; gap:6px; pointer-events:none; }
  #pop, #cargo { flex:0 0 auto; }
  .badge { background:rgba(42,27,61,0.92); color:var(--cream); border:2px solid rgba(255,243,226,0.55);
    border-radius:12px; padding:6px 12px; font-weight:900; font-size:clamp(10px,2.8vw,12px); letter-spacing:0.06em;
    box-shadow:0 3px 0 rgba(20,8,30,0.45); white-space:nowrap; }
  #cargo { color:var(--yellow); font-variant-numeric:tabular-nums; }
  #cargo.full { color:var(--coral); }
  /* THE DOCK. Fixed places, thumb sized, never scrolls. Undo, two pinned blocks, the current block, erase, drive, share. */
  #bottombar { position:fixed; left:0; right:0; bottom:0; padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
    display:flex; gap:6px; align-items:flex-end; justify-content:center; background:linear-gradient(180deg, rgba(42,27,61,0) , rgba(42,27,61,0.88) 30%); z-index:5; }
  .dock { flex:0 0 auto; width:46px; height:58px; border-radius:14px; border:3px solid rgba(255,243,226,0.5); background:rgba(42,27,61,0.92);
    color:var(--cream); font-weight:900; font-size:9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    box-shadow:0 4px 0 rgba(20,8,30,0.5); letter-spacing:0.04em; padding:0; touch-action:manipulation; }
  .dock .ic { font-size:20px; line-height:1; }
  .dock:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  .dock.sel { border-color:var(--yellow); background:var(--dusk); }
  #cur { width:70px; height:70px; border-color:var(--yellow); background:var(--dusk); font-size:10px; }
  #cur canvas, .tool canvas, .pin canvas { width:34px; height:36px; image-rendering:auto; }
  #cur canvas { width:40px; height:42px; }
  .pin { width:40px; height:50px; font-size:8px; }
  #btn-share { background:linear-gradient(180deg,var(--yellow),#E8B830); color:var(--ink); }
  #btn-drive { background:linear-gradient(180deg,var(--coral),#C74744); }
  /* THE DRAWER. Every block, in three groups, drawn by the engine. One tap picks and it drops away. */
  #drawer { position:fixed; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); z-index:7; display:none;
    background:rgba(255,243,226,0.97); border:4px solid var(--ink); border-radius:22px; padding:12px 12px 8px; box-shadow:0 8px 0 rgba(20,8,30,0.5);
    max-height:60dvh; overflow-y:auto; }
  #drawer.on { display:block; }
  #drawer .grp { font-size:10px; font-weight:900; letter-spacing:0.18em; color:var(--dusk); margin:6px 4px 4px; }
  #drawer .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px; margin-bottom:6px; }
  .tool { height:70px; border-radius:14px; border:3px solid var(--ink); background:#fff; color:var(--ink); font-weight:900; font-size:9px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 3px 0 rgba(20,8,30,0.35); letter-spacing:0.04em; padding:0; }
  .tool:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.35); }
  .tool.sel { background:var(--yellow); }
  #tip { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 88px); z-index:6; display:none;
    background:var(--ink); color:var(--cream); border:3px solid var(--cream); border-radius:16px; padding:8px 14px; font-weight:800; font-size:13px; max-width:86vw; text-align:center; }
  #tip.on { display:block; }
  #tip b { color:var(--yellow); }
  #btn-drive { background:linear-gradient(180deg,#FF8A70,var(--coral)); color:var(--cream); }
  #btn-undo  { background:linear-gradient(180deg,var(--peach),var(--coral)); color:var(--ink); }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
    background:rgba(42,27,61,0.94); color:var(--yellow); font-weight:900; font-size:13px;
    padding:9px 16px; border-radius:999px; border:2px solid rgba(255,243,226,0.5); opacity:0;
    transition:opacity 0.25s; pointer-events:none; max-width:86vw; text-align:center; }
  #toast.on { opacity:1; }
  #bubble { position:fixed; width:160px; background:var(--cream); color:var(--ink); font-weight:800;
    font-size:12px; padding:10px 12px; border-radius:14px; border:3px solid var(--ink);
    box-shadow:0 4px 0 rgba(20,8,30,0.4); opacity:0; transform:scale(0.8); transition:all 0.18s;
    pointer-events:none; z-index:5; line-height:1.35; }
  #bubble.on { opacity:1; transform:scale(1); }
  #drivebar { position:fixed; left:0; right:0; bottom:0; display:none; gap:10px; justify-content:center;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 12px); }
  #drivebar.on { display:flex; }
  .dbtn { flex:1 1 0; max-width:120px; height:78px; border-radius:18px; border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--yellow),#E8B830); color:var(--ink); font-weight:900;
    font-size:22px; box-shadow:0 5px 0 rgba(20,8,30,0.5); cursor:pointer; touch-action:none; }
  #d-car { font-size:11px; background:linear-gradient(180deg,#8FD8E8,#4E92B0); letter-spacing:0.04em; }
  #d-exit { font-size:11px; background:linear-gradient(180deg,var(--peach),var(--coral)); letter-spacing:0.04em; }
  .dbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #lapbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 54px); left:50%; transform:translateX(-50%);
    display:none; gap:10px; align-items:center; background:rgba(42,27,61,0.92); color:var(--yellow);
    border:2px solid rgba(255,243,226,0.5); border-radius:12px; padding:5px 14px; font-weight:900;
    font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:0.06em; white-space:nowrap; }
  #lapbar.on { display:flex; }
  #lapbest { color:#8FD8E8; font-size:12px; }
  #lineage { position:fixed; top:calc(env(safe-area-inset-top,0px) + 54px); left:50%;
    transform:translateX(-50%); display:none; background:rgba(42,27,61,0.9); color:#8FD8E8;
    border:2px solid rgba(255,243,226,0.4); border-radius:10px; padding:4px 12px; font-weight:800;
    font-size:11px; letter-spacing:0.05em; white-space:nowrap; max-width:92vw; overflow:hidden;
    text-overflow:ellipsis; }
  #lineage.on { display:block; }
  #btn-remix { background:linear-gradient(180deg,#8FD8E8,#4E92B0); color:var(--ink); display:none; }
  #keeper { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 414px); z-index:6; width:44px; height:44px; border-radius:50%; border:3px solid var(--ink);
    background:var(--cream); font-size:9px; font-weight:900; color:var(--ink); box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; padding:0; line-height:1.1; }
  #btn-remix.on { display:flex; }
  #btn-book { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:6;
    width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--yellow);
    color:var(--ink); font-size:22px; font-weight:900; box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; }
  #btn-book:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #book { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(42,27,61,0.82); padding:14px; }
  #book.on { display:flex; }
  #bookcard { width:100%; max-width:460px; max-height:94dvh; overflow:auto; background:var(--cream);
    border:4px solid var(--ink); border-radius:22px; box-shadow:0 8px 0 rgba(20,8,30,0.55); padding:14px; }
  #bookcanvas { width:100%; height:auto; display:block; border-radius:14px; background:#FFE49E;
    border:3px solid var(--ink); }
  #bookcard h3 { color:var(--ink); font-size:21px; font-weight:900; margin:11px 0 4px; }
  #bookcard p { color:#5a4a63; font-size:14px; font-weight:600; line-height:1.4; }
  #bookq { margin-top:10px; }
  #bookq .q { color:var(--ink); font-weight:900; font-size:14px; margin-bottom:7px; }
  #bookq button { display:block; width:100%; text-align:left; margin-bottom:6px; padding:10px 12px;
    border:3px solid var(--ink); border-radius:12px; background:#fff; color:var(--ink);
    font-weight:800; font-size:14px; cursor:pointer; }
  #bookq button.right { background:#7BD8A0; } #bookq button.wrong { background:#FFB0AE; }
  #bookq .fb { margin-top:6px; font-weight:900; font-size:13px; color:var(--ink); }
  #booknav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .bnav { padding:9px 14px; border:3px solid var(--ink); border-radius:12px; background:var(--peach);
    color:var(--ink); font-weight:900; font-size:13px; cursor:pointer; }
  .bnav:disabled { opacity:0.35; }
  #bdots { display:flex; gap:5px; }
  #bdots i { width:8px; height:8px; border-radius:50%; background:rgba(42,27,61,0.25); display:block; }
  #bdots i.on { background:var(--coral); }
  #dial { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 164px); z-index:6; width:44px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  #dial button { width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--cream); color:var(--ink); font-weight:900; font-size:22px;
    box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; touch-action:none; padding:0; line-height:1; }
  #dial button:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #dial .track { width:14px; height:96px; border-radius:7px; background:rgba(42,27,61,0.55); border:2px solid var(--ink); position:relative; }
  #dial .knob { position:absolute; left:50%; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); box-shadow:0 2px 0 rgba(20,8,30,0.5); pointer-events:none; }
  #dial .snap { position:absolute; left:2px; width:6px; height:2px; background:rgba(255,243,226,0.6); }
  #dial #home { font-size:18px; }
  #mini { position:fixed; left:10px; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:6; width:96px; height:96px; border:3px solid var(--ink); border-radius:14px;
    background:rgba(42,27,61,0.55); box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; touch-action:none; }
  #btn-story { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 104px); z-index:6;
    width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--dusk);
    color:var(--cream); font-size:22px; font-weight:900; box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; }
  #btn-story:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #quest { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
    z-index:5; display:none; background:rgba(42,27,61,0.92); color:var(--yellow); border:2px solid rgba(255,243,226,0.5);
    border-radius:999px; padding:7px 15px; font-weight:900; font-size:12px; max-width:90vw; text-align:center; }
  #quest.on { display:block; }
  #next { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
    z-index:5; display:none; background:rgba(255,243,226,0.94); color:var(--ink); border:2px solid var(--ink);
    border-radius:999px; padding:6px 14px 6px 10px; font-weight:800; font-size:12px; max-width:88vw; text-align:left; line-height:1.3; }
  #next.on { display:block; }
  #next b { color:#8C4A78; }
  #quest.on ~ #next.on { bottom:calc(env(safe-area-inset-bottom,0px) + 148px); }
  #story { position:fixed; inset:0; z-index:21; display:none; align-items:center; justify-content:center;
    background:rgba(28,16,44,0.92); padding:14px; }
  #story.on { display:flex; }
  #storycard { width:100%; max-width:460px; max-height:94dvh; overflow:auto; padding:18px;
    background:linear-gradient(180deg,#2A1B3D,#5C3A6E); border:4px solid var(--cream); border-radius:22px;
    box-shadow:0 8px 0 rgba(10,4,18,0.6); }
  #storyhead { color:var(--yellow); font-size:11px; font-weight:900; letter-spacing:0.22em; text-align:center; }
  #storycard h3 { color:var(--cream); font-size:20px; font-weight:900; margin:10px 0 12px; text-align:center; }
  #storybody p { color:var(--cream); font-size:17px; font-weight:600; line-height:1.55; margin-bottom:11px; }
  #storynav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; }
  #sdots { display:flex; gap:5px; }
  #sdots i { width:8px; height:8px; border-radius:50%; background:rgba(255,243,226,0.3); display:block; }
  #sdots i.on { background:var(--yellow); }
  .sq button { display:block; width:100%; text-align:left; margin-bottom:6px; padding:11px 12px; border:3px solid var(--ink);
    border-radius:12px; background:var(--cream); color:var(--ink); font-weight:800; font-size:15px; cursor:pointer; }
  .sq button.right { background:#7BD8A0; } .sq button.wrong { background:#FFB0AE; }
  .sq .fb { margin-top:6px; font-weight:900; font-size:14px; color:var(--yellow); }
  #shelf { display:none; } #shelf.on { display:block; }
  #shelf button, #sgrown, #shints { display:block; width:100%; text-align:left; margin-bottom:6px; padding:10px 12px; border:2px solid rgba(255,243,226,0.45);
    border-radius:12px; background:rgba(255,243,226,0.08); color:var(--cream); font-weight:800; font-size:14px; cursor:pointer; }
  #shelf button.cur { border-color:var(--yellow); color:var(--yellow); }
  #shelf a { display:block; margin-bottom:6px; padding:10px 12px; border:2px solid rgba(255,243,226,0.45); border-radius:12px; color:#8FD8E8; font-weight:800; font-size:14px; text-decoration:none; }
  #sbook { background:none; border:none; color:#8FD8E8; font-weight:900; font-size:12px; letter-spacing:0.12em; text-decoration:underline; cursor:pointer; margin-top:8px; width:100%; }
  #sclose { width:100%; margin-top:10px; padding:12px; border:3px solid var(--ink); border-radius:14px;
    background:var(--yellow); color:var(--ink); font-weight:900; font-size:16px; letter-spacing:0.06em; cursor:pointer; }
  #bclose { width:100%; margin-top:10px; padding:12px; border:3px solid var(--ink); border-radius:14px;
    background:var(--yellow); color:var(--ink); font-weight:900; font-size:16px; letter-spacing:0.06em; cursor:pointer; }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-12px; margin-left:-8px;
    border:8px solid transparent; border-top-color:var(--ink); }
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="gl"></canvas>
<div id="walkui"><div id="stick"><div id="knob"></div></div><button id="w-jump">JUMP</button><button id="w-exit">STOP<br>WALKING</button><div id="w-hint">Left thumb walks. Right thumb looks. Tap an islander to talk.</div></div>
<div id="topbar">
  <div class="badge" id="title-badge" style="flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis">OLLIE'S ISLAND &middot; GAME 02</div>
  <div class="badge" id="pop" style="color:#8FD8E8">ISLANDERS 0</div>
  <div class="badge" id="cargo">CARGO 0 / 400</div>
</div>
<div id="lineage"></div>
<button id="btn-book" aria-label="How to play">?</button>
<button id="btn-story" aria-label="Story time">&#9789;</button>
<div id="dial"><button id="zin" aria-label="Zoom in">+</button><div class="track"><span class="snap" style="top:6px"></span><span class="snap" style="top:46px"></span><span class="snap" style="top:86px"></span><div class="knob" id="knob"></div></div><button id="zout" aria-label="Zoom out">&minus;</button><button id="home" aria-label="Find my island">&#8962;</button></div>
<canvas id="mini" width="192" height="192" aria-label="Map of the island"></canvas>
<div id="quest"></div>
<div id="next"></div>
<div id="story">
  <div id="storycard">
    <div id="storyhead">STORY TIME</div>
    <h3 id="storytitle"></h3>
    <div id="storybody"></div>
    <div id="storynav">
      <button class="bnav" id="sprev">BACK</button>
      <div id="sdots"></div>
      <button class="bnav" id="snext">NEXT</button>
    </div>
    <div id="shelf"></div>
    <button id="sbook">THE WHOLE BOOK</button>
    <button id="sclose">GOODNIGHT</button>
  </div>
</div>
<div id="book">
  <div id="bookcard">
    <canvas id="bookcanvas" width="560" height="300"></canvas>
    <h3 id="booktitle"></h3>
    <p id="booktext"></p>
    <div id="bookq"></div>
    <div id="booknav">
      <button class="bnav" id="bprev">BACK</button>
      <div id="bdots"></div>
      <button class="bnav" id="bnext">NEXT</button>
    </div>
    <button id="bclose">PLAY!</button>
  </div>
</div>
<div id="bottombar"></div>
<div id="drawer"></div>
<div id="tip"></div>
<button id="keeper" aria-label="Ask the keeper"></button>
<div id="toast"></div>
<div id="bubble"></div>
<div id="drivebar">
  <button class="dbtn" id="d-left">&#9664;</button>
