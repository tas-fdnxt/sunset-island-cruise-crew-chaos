<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A1B3D">
<title>Captain's Island</title>
<meta name="description" content="Build your own island. Houses, paths, palms. Then share the whole island inside a single link. No account, no ads, nothing stored.">
<style>
  :root { --ink:#2A1B3D; --cream:#FFF3E2; --coral:#FF6E6C; --peach:#FFB067;
    --yellow:#FFD447; --green:#3FA96B; --dusk:#5C3A6E; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  canvas#world { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; }
  #topbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:center; gap:6px; pointer-events:none; }
  #pop, #cargo { flex:0 0 auto; }
  .badge { background:rgba(42,27,61,0.92); color:var(--cream); border:2px solid rgba(255,243,226,0.55);
    border-radius:12px; padding:6px 12px; font-weight:900; font-size:clamp(10px,2.8vw,12px); letter-spacing:0.06em;
    box-shadow:0 3px 0 rgba(20,8,30,0.45); white-space:nowrap; }
  #cargo { color:var(--yellow); font-variant-numeric:tabular-nums; }
  #cargo.full { color:var(--coral); }
  #bottombar { position:fixed; left:0; right:0; bottom:0; padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);
    display:flex; gap:6px; overflow-x:auto; background:linear-gradient(180deg, rgba(42,27,61,0) , rgba(42,27,61,0.85) 30%); }
  .tool { flex:0 0 auto; width:58px; height:64px; border-radius:14px; border:3px solid rgba(255,243,226,0.5);
    background:rgba(42,27,61,0.92); color:var(--cream); font-weight:900; font-size:10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 4px 0 rgba(20,8,30,0.5); letter-spacing:0.04em; }
  .tool:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  .tool.sel { border-color:var(--yellow); background:var(--dusk); }
  .tool .sw { width:26px; height:26px; border-radius:6px; border:2px solid var(--ink); }
  #btn-share { background:linear-gradient(180deg,var(--yellow),#E8B830); color:var(--ink); }
  #btn-drive { background:linear-gradient(180deg,#FF8A70,var(--coral)); color:var(--cream); }
  #btn-undo  { background:linear-gradient(180deg,var(--peach),var(--coral)); color:var(--ink); }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
    background:rgba(42,27,61,0.94); color:var(--yellow); font-weight:900; font-size:13px;
    padding:9px 16px; border-radius:999px; border:2px solid rgba(255,243,226,0.5); opacity:0;
    transition:opacity 0.25s; pointer-events:none; max-width:86vw; text-align:center; }
  #toast.on { opacity:1; }
  #bubble { position:fixed; width:160px; background:var(--cream); color:var(--ink); font-weight:800;
    font-size:12px; padding:10px 12px; border-radius:14px; border:3px solid var(--ink);
    box-shadow:0 4px 0 rgba(20,8,30,0.4); opacity:0; transform:scale(0.8); transition:all 0.18s;
    pointer-events:none; z-index:5; line-height:1.35; }
  #bubble.on { opacity:1; transform:scale(1); }
  #drivebar { position:fixed; left:0; right:0; bottom:0; display:none; gap:10px; justify-content:center;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 12px); }
  #drivebar.on { display:flex; }
  .dbtn { flex:1 1 0; max-width:120px; height:78px; border-radius:18px; border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--yellow),#E8B830); color:var(--ink); font-weight:900;
    font-size:22px; box-shadow:0 5px 0 rgba(20,8,30,0.5); cursor:pointer; touch-action:none; }
  #d-car { font-size:11px; background:linear-gradient(180deg,#8FD8E8,#4E92B0); letter-spacing:0.04em; }
  #d-exit { font-size:11px; background:linear-gradient(180deg,var(--peach),var(--coral)); letter-spacing:0.04em; }
  .dbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #lapbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 54px); left:50%; transform:translateX(-50%);
    display:none; gap:10px; align-items:center; background:rgba(42,27,61,0.92); color:var(--yellow);
    border:2px solid rgba(255,243,226,0.5); border-radius:12px; padding:5px 14px; font-weight:900;
    font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:0.06em; white-space:nowrap; }
  #lapbar.on { display:flex; }
  #lapbest { color:#8FD8E8; font-size:12px; }
  #lineage { position:fixed; top:calc(env(safe-area-inset-top,0px) + 54px); left:50%;
    transform:translateX(-50%); display:none; background:rgba(42,27,61,0.9); color:#8FD8E8;
    border:2px solid rgba(255,243,226,0.4); border-radius:10px; padding:4px 12px; font-weight:800;
    font-size:11px; letter-spacing:0.05em; white-space:nowrap; max-width:92vw; overflow:hidden;
    text-overflow:ellipsis; }
  #lineage.on { display:block; }
  #btn-remix { background:linear-gradient(180deg,#8FD8E8,#4E92B0); color:var(--ink); display:none; }
  #btn-remix.on { display:flex; }
  #btn-book { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:6;
    width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--yellow);
    color:var(--ink); font-size:22px; font-weight:900; box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; }
  #btn-book:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #book { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(42,27,61,0.82); padding:14px; }
  #book.on { display:flex; }
  #bookcard { width:100%; max-width:460px; max-height:94dvh; overflow:auto; background:var(--cream);
    border:4px solid var(--ink); border-radius:22px; box-shadow:0 8px 0 rgba(20,8,30,0.55); padding:14px; }
  #bookcanvas { width:100%; height:auto; display:block; border-radius:14px; background:#FFE49E;
    border:3px solid var(--ink); }
  #bookcard h3 { color:var(--ink); font-size:21px; font-weight:900; margin:11px 0 4px; }
  #bookcard p { color:#5a4a63; font-size:14px; font-weight:600; line-height:1.4; }
  #bookq { margin-top:10px; }
  #bookq .q { color:var(--ink); font-weight:900; font-size:14px; margin-bottom:7px; }
  #bookq button { display:block; width:100%; text-align:left; margin-bottom:6px; padding:10px 12px;
    border:3px solid var(--ink); border-radius:12px; background:#fff; color:var(--ink);
    font-weight:800; font-size:14px; cursor:pointer; }
  #bookq button.right { background:#7BD8A0; } #bookq button.wrong { background:#FFB0AE; }
  #bookq .fb { margin-top:6px; font-weight:900; font-size:13px; color:var(--ink); }
  #booknav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .bnav { padding:9px 14px; border:3px solid var(--ink); border-radius:12px; background:var(--peach);
    color:var(--ink); font-weight:900; font-size:13px; cursor:pointer; }
  .bnav:disabled { opacity:0.35; }
  #bdots { display:flex; gap:5px; }
  #bdots i { width:8px; height:8px; border-radius:50%; background:rgba(42,27,61,0.25); display:block; }
  #bdots i.on { background:var(--coral); }
  #btn-story { position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 104px); z-index:6;
    width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--dusk);
    color:var(--cream); font-size:22px; font-weight:900; box-shadow:0 4px 0 rgba(20,8,30,0.5); cursor:pointer; }
  #btn-story:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,8,30,0.5); }
  #quest { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
    z-index:5; display:none; background:rgba(42,27,61,0.92); color:var(--yellow); border:2px solid rgba(255,243,226,0.5);
    border-radius:999px; padding:7px 15px; font-weight:900; font-size:12px; max-width:90vw; text-align:center; }
  #quest.on { display:block; }
  #story { position:fixed; inset:0; z-index:21; display:none; align-items:center; justify-content:center;
    background:rgba(28,16,44,0.92); padding:14px; }
  #story.on { display:flex; }
  #storycard { width:100%; max-width:460px; max-height:94dvh; overflow:auto; padding:18px;
    background:linear-gradient(180deg,#2A1B3D,#5C3A6E); border:4px solid var(--cream); border-radius:22px;
    box-shadow:0 8px 0 rgba(10,4,18,0.6); }
  #storyhead { color:var(--yellow); font-size:11px; font-weight:900; letter-spacing:0.22em; text-align:center; }
  #storycard h3 { color:var(--cream); font-size:20px; font-weight:900; margin:10px 0 12px; text-align:center; }
  #storybody p { color:var(--cream); font-size:17px; font-weight:600; line-height:1.55; margin-bottom:11px; }
  #storynav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; }
  #sdots { display:flex; gap:5px; }
  #sdots i { width:8px; height:8px; border-radius:50%; background:rgba(255,243,226,0.3); display:block; }
  #sdots i.on { background:var(--yellow); }
  #sclose { width:100%; margin-top:10px; padding:12px; border:3px solid var(--ink); border-radius:14px;
    background:var(--yellow); color:var(--ink); font-weight:900; font-size:16px; letter-spacing:0.06em; cursor:pointer; }
  #bclose { width:100%; margin-top:10px; padding:12px; border:3px solid var(--ink); border-radius:14px;
    background:var(--yellow); color:var(--ink); font-weight:900; font-size:16px; letter-spacing:0.06em; cursor:pointer; }
  #bubble::after { content:''; position:absolute; left:50%; bottom:-12px; margin-left:-8px;
    border:8px solid transparent; border-top-color:var(--ink); }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="topbar">
  <div class="badge" id="title-badge" style="flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis">OLLIE'S ISLAND &middot; GAME 02</div>
  <div class="badge" id="pop" style="color:#8FD8E8">ISLANDERS 0</div>
  <div class="badge" id="cargo">CARGO 0 / 400</div>
</div>
<div id="lineage"></div>
<button id="btn-book" aria-label="How to play">?</button>
<button id="btn-story" aria-label="Story time">&#9789;</button>
<div id="quest"></div>
<div id="story">
  <div id="storycard">
    <div id="storyhead">STORY TIME</div>
    <h3 id="storytitle"></h3>
    <div id="storybody"></div>
    <div id="storynav">
      <button class="bnav" id="sprev">BACK</button>
      <div id="sdots"></div>
      <button class="bnav" id="snext">NEXT</button>
    </div>
    <button id="sclose">GOODNIGHT</button>
  </div>
</div>
<div id="book">
  <div id="bookcard">
    <canvas id="bookcanvas" width="560" height="300"></canvas>
    <h3 id="booktitle"></h3>
    <p id="booktext"></p>
    <div id="bookq"></div>
    <div id="booknav">
      <button class="bnav" id="bprev">BACK</button>
      <div id="bdots"></div>
      <button class="bnav" id="bnext">NEXT</button>
    </div>
    <button id="bclose">PLAY!</button>
  </div>
</div>
<div id="bottombar"></div>
<div id="toast"></div>
<div id="bubble"></div>
<div id="drivebar">
  <button class="dbtn" id="d-left">&#9664;</button>
  <button class="dbtn" id="d-car">CHANGE<br>CAR</button>
  <button class="dbtn" id="d-exit">STOP<br>DRIVING</button>
  <button class="dbtn" id="d-right">&#9654;</button>
</div>
<div id="lapbar"><span id="laptime">0:00.0</span><span id="lapbest"></span></div>
<script>
/* CAPTAIN'S ISLAND core: world model + link codec. Pure logic, headless-testable. */
'use strict';
const ISLE = {
  N: 64, ZMAX: 4, MAX_BLOCKS: 400, VER: 1,
  AIR: 0,
  TYPES: [
    null,
    { id:1, name:'GRASS',  top:'#3FA96B', side:'#2F8354', side2:'#37955F' },
    { id:2, name:'SAND',   top:'#FFE49E', side:'#D8B970', side2:'#E8C97E' },
    { id:3, name:'WOOD',   top:'#C9834E', side:'#96602F', side2:'#B06E3C' },
    { id:4, name:'BRICK',  top:'#FF6E6C', side:'#C74744', side2:'#D95552' },
    { id:5, name:'WINDOW', top:'#8FD8E8', side:'#4E92B0', side2:'#5FA8C8' },
    { id:6, name:'DOOR',   top:'#5C3A6E', side:'#3E2650', side2:'#4A2E58' },
    { id:7, name:'ROOF',   top:'#C75B82', side:'#94405E', side2:'#A84568' },
    { id:8, name:'PALM',   top:'#3FA96B', side:'#96602F', side2:'#B06E3C' },
    { id:9, name:'FLAG',   top:'#FFF3E2', side:'#2A1B3D', side2:'#3E2650' },
  ],
};
function makeWorld() {
  return { cols: new Uint8Array(ISLE.N * ISLE.N * ISLE.ZMAX), count: 0, undo: [] };
}
function idx(x, y, z) { return (y * ISLE.N + x) * ISLE.ZMAX + z; }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < ISLE.N && y < ISLE.N; }
function topZ(w, x, y) {
  for (let z = ISLE.ZMAX - 1; z >= 0; z--) if (w.cols[idx(x, y, z)]) return z;
  return -1;
}
function place(w, x, y, id) {
  if (!inBounds(x, y) || id < 1 || id >= ISLE.TYPES.length) return { ok:false, why:'bounds' };
  const t = topZ(w, x, y);
  if (t >= ISLE.ZMAX - 1) return { ok:false, why:'height' };
  if (w.count >= ISLE.MAX_BLOCKS) return { ok:false, why:'cargo' };
  const z = t + 1;
  w.cols[idx(x, y, z)] = id;
  w.count++;
  w.undo.push({ op:'place', x, y, z });
  if (w.undo.length > 500) w.undo.shift();
  return { ok:true, x, y, z, id };
}
function erase(w, x, y) {
  if (!inBounds(x, y)) return { ok:false, why:'bounds' };
  const t = topZ(w, x, y);
  if (t < 0) return { ok:false, why:'empty' };
  const id = w.cols[idx(x, y, t)];
  w.cols[idx(x, y, t)] = 0;
  w.count--;
  w.undo.push({ op:'erase', x, y, z:t, id });
  if (w.undo.length > 500) w.undo.shift();
  return { ok:true, x, y, z:t, id };
}
function undo(w) {
  const u = w.undo.pop();
  if (!u) return { ok:false };
  if (u.op === 'place') { w.cols[idx(u.x, u.y, u.z)] = 0; w.count--; }
  else { w.cols[idx(u.x, u.y, u.z)] = u.id; w.count++; }
  return { ok:true, undone:u };
}
/* Codec: 3 bytes per block: x(6b)+y(2b hi) | y(4b lo)+z(2b)+id(2b hi) | id(2b lo)+spare.
   Simpler and safer: x(1 byte), y(1 byte), z<<4|id (1 byte). 400*3=1200 bytes.
   base64url of 1200+2 header bytes = 1604 chars worst case, deterministically under budget. */
function encode(w) {
  const blocks = [];
  for (let y = 0; y < ISLE.N; y++) for (let x = 0; x < ISLE.N; x++)
    for (let z = 0; z < ISLE.ZMAX; z++) { const v = w.cols[idx(x, y, z)]; if (v) blocks.push([x, y, z, v]); }
  const buf = new Uint8Array(2 + blocks.length * 3);
  buf[0] = ISLE.VER; buf[1] = 0;
  blocks.forEach((b, i) => { const o = 2 + i * 3; buf[o] = b[0]; buf[o+1] = b[1]; buf[o+2] = (b[2] << 4) | b[3]; });
  let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  const b64 = (typeof btoa !== 'undefined' ? btoa(bin) : Buffer.from(buf).toString('base64'));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(str) {
  let raw;
  try {
    const b64 = String(str).replace(/-/g, '+').replace(/_/g, '/');
    if (typeof atob !== 'undefined') { const s = atob(b64); raw = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) raw[i] = s.charCodeAt(i); }
    else raw = new Uint8Array(Buffer.from(b64, 'base64'));
  } catch (e) { return null; }
  if (raw.length < 2 || raw[0] !== ISLE.VER) return null;
  if ((raw.length - 2) % 3 !== 0) return null;
  const w = makeWorld();
  for (let o = 2; o < raw.length; o += 3) {
    const x = raw[o], y = raw[o+1], z = raw[o+2] >> 4, id = raw[o+2] & 15;
    if (!inBounds(x, y) || z >= ISLE.ZMAX || id < 1 || id >= ISLE.TYPES.length) return null;
    if (w.cols[idx(x, y, z)]) return null;
    w.cols[idx(x, y, z)] = id; w.count++;
    if (w.count > ISLE.MAX_BLOCKS) return null;
  }
  return w;
}
/* House detection: a DOOR with a real structure around it makes a home.
   Deterministic from world state, so islanders travel inside the share link for free. */
function flags(w) {
  const out = [];
  for (let y = 0; y < ISLE.N; y++) for (let x = 0; x < ISLE.N; x++)
    for (let z = 0; z < ISLE.ZMAX; z++) if (w.cols[idx(x, y, z)] === 9) { out.push({ x, y }); break; }
  return out;
}
function fmtLap(ms) {
  if (!(ms > 0)) return '';
  const s = Math.floor(ms / 1000), t = Math.floor((ms % 1000) / 100);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '.' + t;
}
function sanitizeName(s) {
  return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 10);
}
function parseHash(hash) {
  if (!hash || hash.indexOf('#i=') !== 0) return null;
  const segs = hash.slice(3).split('&');
  const out = { enc: segs[0], t: 0, b: '', c: [] };
  for (let i = 1; i < segs.length; i++) {
    const s = segs[i];
    try {
      if (s.indexOf('t=') === 0) { const v = parseInt(s.slice(2), 10); if (v > 0 && v < 3600000) out.t = v; }
      else if (s.indexOf('b=') === 0) out.b = sanitizeName(decodeURIComponent(s.slice(2)));
      else if (s.indexOf('c=') === 0) out.c = s.slice(2).split(',').map(function (x) { return sanitizeName(decodeURIComponent(x)); }).filter(Boolean).slice(0, 3);
    } catch (e) {}
  }
  return out;
}
function buildHash(enc, t, b, chain) {
  let s = '#i=' + enc;
  if (t > 0) s += '&t=' + Math.round(t);
  const bn = sanitizeName(b);
  if (bn) s += '&b=' + encodeURIComponent(bn);
  const c = (chain || []).map(sanitizeName).filter(Boolean).slice(0, 3);
  if (c.length) s += '&c=' + c.map(encodeURIComponent).join(',');
  return s;
}
function questTable() {
  return [
    { id: 'houses3', need: 'houses', n: 3, tell: 'build a third house so the island has a proper village',
      done: 'The village grew to three houses.' },
    { id: 'palms', need: 'palms', n: 4, tell: 'plant four palm trees so the beach has shade',
      done: 'Four palms now shade the beach.' },
    { id: 'flag', need: 'flags', n: 1, tell: 'plant a racing flag and drive the very first lap',
      done: 'A racing flag went up.' },
    { id: 'tall', need: 'tallest', n: 4, tell: 'build a lighthouse four blocks tall, the tallest thing on the island',
      done: 'A tower rose four blocks high.' },
    { id: 'houses6', need: 'houses', n: 6, tell: 'grow the village to six houses so everyone has a neighbour',
      done: 'Six houses stood in a row.' },
  ];
}
function worldStats(w) {
  const st = { blocks: w.count, houses: houses(w).length, flags: flags(w).length, palms: 0, tallest: 0 };
  for (let y = 0; y < ISLE.N; y++) for (let x = 0; x < ISLE.N; x++) {
    const t = topZ(w, x, y);
    if (t + 1 > st.tallest) st.tallest = t + 1;
    for (let z = 0; z < ISLE.ZMAX; z++) if (w.cols[idx(x, y, z)] === 8) st.palms++;
  }
  return st;
}
function pickQuest(stats, lastId) {
  const t = questTable();
  for (let i = 0; i < t.length; i++) {
    const q = t[i];
    if (q.id === lastId) continue;
    if ((stats[q.need] || 0) < q.n) return q;
  }
  return t[t.length - 1];
}
function questMet(q, stats) { return q ? (stats[q.need] || 0) >= q.n : false; }
function chapter(o) {
  const name = sanitizeName(o.name) || 'CAPTAIN';
  const cap = name.charAt(0) + name.slice(1).toLowerCase();
  const s = o.stats || {}, prev = o.prevStats || {};
  const built = Math.max(0, (s.blocks || 0) - (prev.blocks || 0));
  const newHouses = Math.max(0, (s.houses || 0) - (prev.houses || 0));
  const page1 = [];
  page1.push('Captain ' + cap + ' woke up on Sunset Island, where the sea is pink at dinner time.');
  if (built > 0) page1.push('Today ' + cap + ' carried ' + built + ' block' + (built === 1 ? '' : 's') + ' up the beach.');

    car, flags: () => flags(world.ref), fmtLap, setDrive: (b) => setDrive(b),
    isDriving: () => driving, steer: (v) => { car.steer = v; },
    lapInfo: () => ({ best: bestLap, ghost: ghostLap, started: !!lapStart, armed: lapArmed }),
    forceBest: (ms) => { bestLap = ms; },
    remix, lineage: () => ({ builder, chain, crew: CREW }), parseHash, buildHash, sanitizeName,
    saveNow, loadSave, openBook, closeBook, cards: CARDS, answers: loadAnswers,
    openStory, storyPages: () => storyPages, journal: () => journal, refreshQuest,
    cars: CARS, carIdx: () => carIdx, setCar: (i) => { carIdx = i; }, personal: PERSONAL, sayPersonal,
    worldStats: () => worldStats(world.ref), noteLearned, place: (x,y,id) => { const r = place(world.ref, x, y, id); if (r.ok) { redrawWorld(); syncCargo(); popCheck(); saveSoon(); } return r; },
    erase: (x,y) => { const r = erase(world.ref, x, y); if (r.ok) { redrawWorld(); syncCargo(); popCheck(); saveSoon(); } return r; },
    undo: () => { const r = undo(world.ref); if (r.ok) { redrawWorld(); syncCargo(); popCheck(); saveSoon(); } return r; },
    encode: () => encode(world.ref), shareUrl, cellAt, isoX, isoY, cam, ISLE };
  boot();
})();
